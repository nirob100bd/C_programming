# CForge full-stack local deployment:
#   - CForge: PostgreSQL + one-shot migrate/seed + Next.js web server
#   - Judge0 CE v1.13.1: db + redis + server + workers
#
# Usage:
#   docker-compose up -d --build
#   open http://localhost:3000
#
# All services communicate over the shared private `cforge-net` bridge network.
# The Judge0 server and workers enable per-process time/memory limits so
# `isolate` runs without cgroup v1 (required on Windows Docker Desktop / WSL2
# and modern Linux cgroup-v2 hosts, avoiding `/box/main.c` Internal Errors).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cforge
      POSTGRES_PASSWORD: cforge
      POSTGRES_DB: cforge
    ports:
      - "5432:5432"
    volumes:
      - cforge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cforge -d cforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cforge-net
    restart: unless-stopped

  # Applies committed Prisma migrations and the idempotent content seed, then
  # exits. The web service waits for a successful exit before starting.
  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgresql://cforge:cforge@db:5432/cforge?schema=public
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-dev-compose-secret-change-before-deploying}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cforge-net
    restart: "no"

  judge0-db:
    image: postgres:16.2
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: "${JUDGE0_POSTGRES_PASSWORD:-judge0password}"
    volumes:
      - judge0-db:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cforge-net
    restart: unless-stopped

  judge0-redis:
    image: redis:7.2.4
    command:
      - bash
      - -c
      - 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: "${JUDGE0_REDIS_PASSWORD:-judge0redispassword}"
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cforge-net
    restart: unless-stopped

  judge0-server:
    image: judge0/judge0:1.13.1
    privileged: true
    ports:
      - "2358:2358"
    environment:
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: "${JUDGE0_POSTGRES_PASSWORD:-judge0password}"
      REDIS_HOST: judge0-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${JUDGE0_REDIS_PASSWORD:-judge0redispassword}"
      AUTHN_TOKEN: "${JUDGE0_API_KEY:-}"
      # Windows/WSL2 cgroup-v2 workaround: bypass isolate --cg hierarchy
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2358/ >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    networks:
      - cforge-net
    restart: unless-stopped

  judge0-workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    privileged: true
    environment:
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: "${JUDGE0_POSTGRES_PASSWORD:-judge0password}"
      REDIS_HOST: judge0-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${JUDGE0_REDIS_PASSWORD:-judge0redispassword}"
      # Windows/WSL2 cgroup-v2 workaround: bypass isolate --cg hierarchy
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
      judge0-server:
        condition: service_healthy
    networks:
      - cforge-net
    restart: unless-stopped

  web:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://cforge:cforge@db:5432/cforge?schema=public
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-dev-compose-secret-change-before-deploying}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      JUDGE0_URL: http://judge0-server:2358
      JUDGE0_API_KEY: "${JUDGE0_API_KEY:-}"
      JUDGE0_LANGUAGE_ID: "${JUDGE0_LANGUAGE_ID:-50}"
      NEXT_PUBLIC_APP_NAME: "${NEXT_PUBLIC_APP_NAME:-CForge}"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      judge0-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks:
      - cforge-net
    restart: unless-stopped

networks:
  cforge-net:
    driver: bridge

volumes:
  cforge-db:
  judge0-db:
