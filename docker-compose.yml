# CForge local stack: PostgreSQL + one-shot migrate/seed + the Next.js app.
#
#   docker compose up --build
#   open http://localhost:3000
#
# Judge0 is intentionally *not* part of this stack. CForge never executes C in
# the Next.js process; without JUDGE0_URL every run/submission returns a clear
# HTTP 503 instead of a fabricated verdict. Follow docs/JUDGE0_SETUP.md and set
# JUDGE0_URL (and JUDGE0_API_KEY) to a reachable Judge0 CE instance to enable
# real compilation.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cforge
      POSTGRES_PASSWORD: cforge
      POSTGRES_DB: cforge
    ports:
      - "5432:5432"
    volumes:
      - cforge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cforge -d cforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Applies committed Prisma migrations and the idempotent content seed, then
  # exits. The web service waits for a successful exit before starting.
  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgresql://cforge:cforge@db:5432/cforge?schema=public
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-dev-compose-secret-change-before-deploying}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://cforge:cforge@db:5432/cforge?schema=public
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-dev-compose-secret-change-before-deploying}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      JUDGE0_URL: "${JUDGE0_URL:-}"
      JUDGE0_API_KEY: "${JUDGE0_API_KEY:-}"
      JUDGE0_LANGUAGE_ID: "${JUDGE0_LANGUAGE_ID:-50}"
      NEXT_PUBLIC_APP_NAME: "${NEXT_PUBLIC_APP_NAME:-CForge}"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    restart: unless-stopped

volumes:
  cforge-db:
